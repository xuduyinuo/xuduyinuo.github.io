title: Xudu
subtitle:
description: 记录技术探索、观影感受与日常思考。
lang: zh-CN
timezone: Asia/Shanghai
author: Xudu
# GitHub Pages 个人主页；工作流会读取 Pages 设置并覆盖构建时的域名。
url: "https://xuduyinuo.github.io"
baseurl: ""
email: ""
github_username: ""
permalink: /:title/
# 使用项目内的布局和样式，不依赖外部主题。
plugins:
  - jekyll-feed
posts_per_page: 10
pagination_path: "/page/:num/"
excerpt_separator: "<!-- more -->"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - DEPLOY.md
  - Gemfile
  - Gemfile.lock
  - vendor
