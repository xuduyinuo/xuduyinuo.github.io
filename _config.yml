title: Xudu
subtitle:
description: 记录技术探索、观影感受与日常思考。
lang: zh-CN
timezone: Asia/Shanghai
author: Xudu
# GitHub Pages 个人主页；工作流会读取 Pages 设置并覆盖构建时的域名。
url: "https://xuduyinuo.cn"
baseurl: ""
# Search Console 的 HTML 标记验证：仅填写 content 中的验证码。
google_site_verification: ""
email: ""
github_username: ""
permalink: /:title/
# 使用项目内的布局和样式，不依赖外部主题。
plugins:
  - jekyll-feed
posts_per_page: 10
# 超过此行数的代码默认折叠，预览前 12 行。
code_fold_lines: 20
code_preview_lines: 12
pagination_path: "/page/:num/"
excerpt_separator: "<!-- more -->"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - DEPLOY.md
  - Gemfile
  - Gemfile.lock
  - vendor

# giscus 评论：仅授权博客仓库，评论保存在 Announcements 分类。
giscus:
  enabled: true
  repo: "xuduyinuo/xuduyinuo.github.io"
  repo_id: "R_kgDOQPt5qw"
  category: "Announcements"
  category_id: "DIC_kwDOQPt5q84DIZZn"
  theme: "light"
