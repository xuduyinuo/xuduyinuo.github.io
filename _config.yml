title: Xudu
subtitle:
description: 记录技术探索、观影感受与日常思考。
lang: zh-CN
timezone: Asia/Shanghai
author: Xudu
# 部署时填写域名；项目站点使用 baseurl: "/blog"，个人主页使用 ""。
url: ""
baseurl: ""
email: ""
github_username: ""
permalink: /:year/:month/:day/:title/
# 使用项目内的布局和样式，不依赖外部主题。
plugins:
  - jekyll-feed
posts_per_page: 10
pagination_path: "/page/:num/"
excerpt_separator: "<!-- more -->"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - DEPLOY.md
  - Gemfile
  - Gemfile.lock
  - vendor
