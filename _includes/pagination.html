{% assign pagination = page.pagination %}
{% if pagination.total_pages > 1 %}
<nav class="pagination" aria-label="文章分页">
  {% if pagination.previous_path %}<a class="pagination-button pagination-newer" href="{{ pagination.previous_path | relative_url }}" rel="prev">← 更新的文章</a>{% endif %}
  {% if pagination.next_path %}<a class="pagination-button pagination-older" href="{{ pagination.next_path | relative_url }}" rel="next">更早的文章 →</a>{% endif %}
</nav>
{% endif %}
